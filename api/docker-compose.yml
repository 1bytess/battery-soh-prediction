# api/docker-compose.yml

version: '3.8'

services:
  battery-soh-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DEBUG=false
    volumes:
      - ./models:/app/models:ro  # Mount models directory as read-only
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - battery-soh-network

networks:
  battery-soh-network:
    driver: bridge